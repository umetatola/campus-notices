name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      # Integration tests start PostgreSQL with Testcontainers; the runner has Docker.
      - run: ./gradlew test
      # Testcontainers skips the integration tests without Docker; in CI that must never pass silently.
      - name: Check that no test was skipped
        run: |
          python3 - <<'PY'
          import glob, os, xml.etree.ElementTree as ET
          rows, skipped = [], 0
          for f in sorted(glob.glob("build/test-results/test/*.xml")):
              s = ET.parse(f).getroot()
              rows.append(f"| {s.get('name').rsplit('.', 1)[-1]} | {s.get('tests')} | {s.get('skipped')} | {s.get('failures')} |")
              skipped += int(s.get("skipped"))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
              out.write("| Test class | Tests | Skipped | Failures |\n|---|---|---|---|\n" + "\n".join(rows) + "\n")
          if skipped:
              raise SystemExit(f"{skipped} tests were skipped; integration tests need Docker in CI")
          PY
      - name: Coverage summary
        run: |
          python3 - <<'PY'
          import os, xml.etree.ElementTree as ET
          root = ET.parse("build/reports/jacoco/test/jacocoTestReport.xml").getroot()
          def pct(el, kind):
              c = next((c for c in el.findall("counter") if c.get("type") == kind), None)
              if c is None:
                  return "–", 0
              covered, missed = int(c.get("covered")), int(c.get("missed"))
              return f"{100 * covered / (covered + missed):.0f}%", covered + missed
          rows = []
          for p in sorted(root.findall("package"), key=lambda p: p.get("name")):
              line, n = pct(p, "LINE")
              branch, _ = pct(p, "BRANCH")
              rows.append(f"| {p.get('name').replace('/', '.')} | {line} | {branch} | {n} |")
          total, _ = pct(root, "LINE")
          total_branch, _ = pct(root, "BRANCH")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
              out.write(f"\n### Coverage: {total} of lines, {total_branch} of branches\n\n"
                        "| Package | Lines | Branches | Lines total |\n|---|---|---|---|\n" + "\n".join(rows) + "\n")
          print(f"Line coverage {total}, branch coverage {total_branch}")
          PY
      - name: Keep the coverage report
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/build/reports/jacoco/test/html
      - name: Keep the test report when something fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-report
          path: backend/build/reports/tests/test

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - name: Keep the trace when something fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: frontend/test-results

  image:
    name: Docker image
    needs: [backend, frontend, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # Pushes to main publish the image to GitHub's registry; the server pulls it from there.
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
