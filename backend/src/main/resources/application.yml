spring:
  application:
    name: campus-notices
  # Local secrets such as ANTHROPIC_API_KEY live in the project's .env file (never committed).
  config:
    import: "optional:file:.env[.properties],optional:file:../.env[.properties]"
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/campus_notices}
    username: ${DB_USER:campus}
    password: ${DB_PASSWORD:campus}
  mvc:
    # errors as RFC 9457 problem details, so the web app can show the reason ("You already follow ...")
    problemdetails:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  # Outgoing email. The defaults point at Mailpit from docker-compose (web UI: http://localhost:8025).
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}

server:
  servlet:
    session:
      timeout: 30d
      cookie:
        http-only: true
        same-site: lax
        # true in production (HTTPS only)
        secure: ${COOKIE_SECURE:false}

app:
  base-url: ${APP_BASE_URL:http://localhost:5173}
  mail-from: ${MAIL_FROM:Campus Notices <no-reply@campus-notices.local>}

alerts:
  interval: PT1M
  summary-wait: PT30M
  max-attempts: 5

crawler:
  enabled: ${CRAWLER_ENABLED:true}
  # Ajou's main notice board (all offices). robots.txt allows /kr/ajou/; /oia- pages are excluded.
  list-url: https://www.ajou.ac.kr/kr/ajou/notice.do
  source: ajou-main
  interval: PT15M
  initial-delay: PT10S
  # Re-fetch notices posted in the last 7 days, each at most every 6 hours, 10 per run, to catch edits.
  recheck-days: 7
  recheck-every: PT6H
  recheck-batch: 10
  # Pause between any two requests to the university server.
  request-delay: PT1S
  # How far back to go when a page has only unknown notices (first run / backfill).
  max-pages: 5
  user-agent: "CampusNotices/0.1 (student project; English notice digest)"

summarizer:
  # auto: Claude when ANTHROPIC_API_KEY is set, otherwise off (notices stay queued). Also: anthropic, stub, none.
  provider: ${SUMMARIZER_PROVIDER:auto}
  api-key: ${ANTHROPIC_API_KEY:}
  model: ${SUMMARIZER_MODEL:claude-opus-5}
  fallbacks: true
  interval: PT10S
  batch-size: 5
  max-attempts: 5

# API documentation: OpenAPI JSON at /api/openapi, interactive Swagger UI at /api/docs
springdoc:
  api-docs:
    path: /api/openapi
  swagger-ui:
    path: /api/docs
  paths-to-match: /api/**

management:
  health:
    # an SMTP outage must not mark the site as down; failed emails are retried by the outbox
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        # prometheus is for the server only: Caddy answers 404 for it from outside
        include: health,info,prometheus
