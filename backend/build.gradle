plugins {
	id 'java'
	id 'jacoco'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.campusnotices'
version = '0.1.0'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	implementation 'org.flywaydb:flyway-database-postgresql'
	implementation 'org.jsoup:jsoup:1.23.2'
	implementation 'com.anthropic:anthropic-java:2.65.0'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'
	runtimeOnly 'org.postgresql:postgresql'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-postgresql'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
	finalizedBy 'jacocoTestReport'
}

// Windows desktop app: the same server plus a private PostgreSQL, shown in its own window (src/desktop).
// Kept out of bootJar, so the server image doesn't change. Build and install with desktop/install.ps1.
sourceSets {
	desktop {
		compileClasspath += sourceSets.main.output
		runtimeClasspath += sourceSets.main.output
	}
}

configurations {
	desktopImplementation.extendsFrom implementation
	desktopRuntimeOnly.extendsFrom runtimeOnly
}

dependencies {
	desktopImplementation('io.zonky.test:embedded-postgres:2.2.2') {
		exclude group: 'io.zonky.test.postgres'
	}
	desktopRuntimeOnly 'io.zonky.test.postgres:embedded-postgres-binaries-windows-amd64:17.11.0'
}

tasks.named('processDesktopResources') {
	from('../frontend/dist') { into 'static' }
}

def desktopJar = tasks.register('desktopJar', Jar) {
	archiveBaseName = 'campus-notices-desktop'
	from sourceSets.desktop.output
}

def desktopInput = tasks.register('desktopInput', Sync) {
	from tasks.named('jar')
	from desktopJar
	from configurations.desktopRuntimeClasspath
	into layout.buildDirectory.dir('desktop/input')
}

tasks.register('desktopImage', Exec) {
	dependsOn desktopInput
	def dest = layout.buildDirectory.dir('desktop/image').get().asFile
	def jdk = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
	doFirst {
		delete dest
		executable = "${jdk.get().metadata.installationPath}/bin/jpackage"
	}
	args '--type', 'app-image', '--name', 'Campus Notices', '--app-version', version,
			'--input', desktopInput.get().destinationDir,
			'--main-jar', "campus-notices-desktop-${version}.jar",
			'--main-class', 'com.campusnotices.desktop.DesktopLauncher',
			'--icon', file('../desktop/campus-notices.ico'),
			'--java-options', '-Xmx512m',
			'--dest', dest
}

// Coverage report after every test run: build/reports/jacoco/test/html (CI also writes a summary table)
tasks.named('jacocoTestReport') {
	reports {
		xml.required = true
		html.required = true
	}
}
